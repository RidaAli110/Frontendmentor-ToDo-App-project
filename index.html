<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>

    <title>Frontend Mentor | Todo app</title>
  </head>
  <body>
    <!-- Top Header and toggle theme button -->
    <div id="wrapper" class="center-aligned">
      <header class="header">
        <picture>
          <source
            media="(max-width: 600px)"
            srcset="./images/bg-mobile-dark.jpg"
          />
          <img class="head-image" src="./images/bg-desktop-dark.jpg" alt="" />
        </picture>
        <div class="heading">
          <h1>TODO</h1>
          <button
            aria-label="Switch to light mode"
            class="theme-btn"
            type="button"
          >
            <img src="/images/icon-sun.svg" alt="" />
          </button>
        </div>
      </header>
    </div>
    <!-- Create New To Do -->
    <main>
      <section aria-label="Create new todo" class="input-container">
        <span class="circle"></span>
        <label for="add-item" class="visually-hidden">Create a new todo</label>
        <input id="add-item" type="text" placeholder="Create a new todo..." />
      </section>
      <!-- Created Todos and completed buttons -->
      <section class="todo-list">
        <ul class="todo-items-list">
          <!-- JavaScript will add each list item -->
        </ul>
        <div class="filterBtns-itemsLeft-clearBtn">
          <p aria-live="polite" class="items-left">0 items left</p>
          <div id="filter-container">
            <button
              data-filter="all"
              aria-pressed="true"
              class="filter-btns btns"
              type="button"
            >
              All
            </button>
            <button
              data-filter="active"
              aria-pressed="false"
              class="filter-btns btns"
              type="button"
            >
              Active
            </button>
            <button
              data-filter="completed"
              aria-pressed="false"
              class="filter-btns btns"
              type="button"
            >
              Completed
            </button>
          </div>
          <button type="button" class="clear-completed btns">
            Clear Completed
          </button>
        </div>
      </section>
    </main>
    <footer class="attribution">
      Challenge by&nbsp;
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by Rida.
    </footer>
  </body>
</html>
