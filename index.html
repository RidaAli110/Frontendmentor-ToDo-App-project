<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>

    <title>Frontend Mentor | Todo app</title>
  </head>
  <body>
    <!-- Top Header and toggle theme button -->
    <div id="wrapper" class="center-aligned">
      <header class="header">
        <img src="images/bg-desktop-dark.jpg" class="head-image" />
        <div class="heading">
          <h1>TODO</h1>
          <button class="theme-btn">
            <img src="/images/icon-sun.svg" alt="Light mode icon" />
          </button>
        </div>
      </header>
    </div>
    <!-- Create New To Do -->
    <section class="input-container">
      <input id="add-item" type="text" placeholder="Create a new todo..." />
    </section>
    <main>
      <!-- Created Todos and completed buttons -->
      <section class="todo-list">
        <div class="list-item">
          <button class="completed" type="button">Tick</button>
          <p class="list-item">My Todo list Item</p>
        </div>
        <section class="filterBtns-itemsLeft-clearBtn">
          <p>5 items left</p>
          <div id="filter-container">
            <button class="filter-btns" type="button">All</button>
            <button class="filter-btns" type="button">Active</button>
            <button class="filter-btns" type="button">Completed</button>
          </div>
          <button class="clear-completed">Clear Completed</button>
        </section>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Rida</a>.
    </footer>
  </body>
</html>
