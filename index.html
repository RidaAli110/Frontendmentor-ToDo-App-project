<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>

    <title>Frontend Mentor | Todo app</title>
  </head>
  <body>

    <!-- Top Header and toggle theme button -->
    <div id="wrapper" class="center-aligned">
      <header class="header">
        <img src="images/bg-desktop-dark.jpg" class="head-image" alt=""/>
        <div class="heading">
          <h1>TODO</h1>
          <button aria-label="Switch to Light theme" class="theme-btn">
            <img src="/images/icon-sun.svg" alt="" />
          </button>
        </div>
      </header>
    </div>
    <!-- Create New To Do -->
    <div class="input-container">
      <span class="circle"></span>
      <label for="add-item" class="visually-hidden">Create a new todo</label>
      <input id="add-item" type="text" placeholder="Create a new todo..." />
    </div>
    <main>
      <!-- Created Todos and completed buttons -->
      <section class="todo-list">
        <div class="list-item">
          <button aria-label="Mark todo as completed" class="completed" type="button">Tick</button>
          <p class="list-item">My Todo list Item</p>
        </div>
        <div class="filterBtns-itemsLeft-clearBtn">
          <p aria-live="polite">5 items left</p>
          <div id="filter-container">
            <button aria-pressed="true"  class="filter-btns" type="button">All</button>
            <button aria-pressed="false"  class="filter-btns" type="button">Active</button>
            <button aria-pressed="false" class="filter-btns" type="button">Completed</button>
          </div>
          <button class="clear-completed">Clear Completed</button>
        </div>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by Rida.
    </footer>
  </body>
</html>
